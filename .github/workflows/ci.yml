name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oston
          POSTGRES_PASSWORD: oston
          POSTGRES_DB: oston
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://oston:oston@localhost:5432/oston?sslmode=disable
      DIRECT_URL: postgresql://oston:oston@localhost:5432/oston?sslmode=disable
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars-min
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REVALIDATION_SECRET: ci-revalidation-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - name: Create OWNER bootstrap
        env:
          ADMIN_EMAIL: ci-owner@ostoncookware.com
          ADMIN_PASSWORD: CiPassword1234
          ADMIN_NAME: CI Owner
        run: pnpm admin:create
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: API integration
        env:
          RUN_API_INTEGRATION: "true"
        run: pnpm --filter @oston/api test
      - run: pnpm build
      - name: Install Playwright
        run: pnpm --filter @oston/web exec playwright install --with-deps chromium
      - name: E2E suites
        env:
          E2E_ADMIN_EMAIL: ci-owner@ostoncookware.com
          E2E_ADMIN_PASSWORD: CiPassword1234
        run: |
          pnpm --filter @oston/web exec playwright test e2e/catalogue.spec.ts e2e/media-source.spec.ts e2e/runtime.spec.ts --workers=1 --output=test-results/catalogue
          pnpm --filter @oston/web exec playwright test e2e/auth.spec.ts e2e/editorial.spec.ts e2e/preview.spec.ts --workers=1 --output=test-results/editorial
          pnpm --filter @oston/web exec playwright test e2e/smoke.spec.ts --workers=1 --output=test-results/smoke
      - name: Preserve failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
