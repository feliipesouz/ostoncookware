services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oston
      POSTGRES_PASSWORD: oston
      POSTGRES_DB: oston
    ports:
      # 5432 is often taken by other local Postgres instances.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oston -d oston"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
